<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gengar Archive · The collection</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="brand" href="/"><span class="orb">G</span><div><strong>GENGAR ARCHIVE</strong><small>The collection</small></div></a><a href="/admin">Owner sign-in ↗</a></header>
<main><section class="intro"><div><div class="eyebrow">A COLLECTION THROUGH THE YEARS</div><h1>A home for every Gengar.</h1><p>Explore the cards, their printings, and both sides of every slab.</p></div></section>
<div class="toolbar"><input id="search" type="search" aria-label="Search collection" placeholder="Search card, set, year, or variant"><select id="set-filter" aria-label="Filter set"><option value="">All sets</option></select><select id="grade-filter" aria-label="Filter grade"><option value="">All grades</option></select></div>
<p id="notice" class="notice" role="status">Loading collection…</p><section id="grid" class="grid" aria-label="Collection cards"></section></main>
<dialog id="viewer"><div class="dialog-head"><div><div class="eyebrow">IN THE COLLECTION</div><h2 id="view-title"></h2></div><button id="view-close" aria-label="Close card">✕</button></div><div class="editor-body"><div class="visual"><div class="tabs" role="group" aria-label="Photo side"><button id="view-front" aria-pressed="true">Front</button><button id="view-back" aria-pressed="false">Back</button></div><a id="view-zoom" target="_blank" rel="noreferrer"><img id="view-photo" alt=""></a><p class="muted">Choose a side, then click the image for a larger view.</p></div><div><dl id="view-details" class="view-details"></dl></div></div></dialog>
<script type="module" src="/gallery.js"></script></body></html>
